services:
  - type: web
    name: aluongcapu
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: our_little_universe
      - key: MEDIA_STORAGE
        value: gridfs
      - key: COOKIE_SECURE
        value: "true"
      - key: OWNER_SETUP_CODE
        generateValue: true
